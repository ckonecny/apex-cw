name: Dependency vulnerabilities

# Scans pubspec.lock against the OSV database. Gradle/native dependencies have
# no lockfile and are covered by Dependabot (gradle ecosystem) instead; the
# gradle paths below only re-run this scan when a build file changes.

on:
  push:
    branches: [main]
    paths:
      - 'android/pubspec.lock'
      - 'android/android/**/*.gradle*'
  pull_request:
    paths:
      - 'android/pubspec.lock'
      - 'android/android/**/*.gradle*'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          base=https://github.com/google/osv-scanner/releases/download/v1.9.2
          curl -sSfL -o osv-scanner "$base/osv-scanner_linux_amd64"
          curl -sSfL -o SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' SHA256SUMS | sed 's/osv-scanner_linux_amd64$/osv-scanner/' | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan pubspec.lock
        run: ./osv-scanner --lockfile=android/pubspec.lock
