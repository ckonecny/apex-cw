name: CodeQL

# Static security analysis of the native parts (Kotlin, C++). Dart is not
# supported by CodeQL; flutter analyze covers that side. One job, one build:
# both languages are traced during the same debug build (the results still
# show up as two separate analyses in the Security tab).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FLUTTER_VERSION: '3.47.3'   # keep equal to ci.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java-kotlin, c-cpp
          build-mode: manual
      - name: Build debug APK once for CodeQL to trace (Kotlin and C++)
        run: flutter build apk --debug
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
