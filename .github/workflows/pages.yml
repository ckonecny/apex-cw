name: Website

# Publishes site/ (landing page) plus the built manuals to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'manual/*.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          cp -r site _site
          en=$(ls manual/NextCWTrainer_Manual_v*.html | sort -V | tail -1)
          de=$(ls manual/NextCWTrainer_Handbuch_v*.html | sort -V | tail -1)
          cp "$en" _site/manual-en.html
          cp "$de" _site/manual-de.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
