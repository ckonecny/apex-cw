name: CI

# Analyze + test + debug build on every push to main and on every PR.
# Flutter is pinned to the version the project is developed with; bump it
# here when you upgrade locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (must stay at zero issues)
        run: flutter analyze
      - name: Tests (includes licence and overflow checks)
        run: flutter test

  build-debug:
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (compiles Kotlin + C++/JNI)
        run: flutter build apk --debug
